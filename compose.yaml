services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-alfa_credit}
      POSTGRES_USER: ${DB_USER:-alfa_credit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "false"
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_USER_RATE: ${AI_USER_RATE:-10/min}
      AI_HISTORY_DAYS: ${AI_HISTORY_DAYS:-7}
      AI_MAX_MESSAGE_LENGTH: ${AI_MAX_MESSAGE_LENGTH:-2000}
      LLM_PROVIDER: ${LLM_PROVIDER:-compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct-q4_0}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-}
      LLM_LOCAL_FALLBACK_BASE_URL: ${LLM_LOCAL_FALLBACK_BASE_URL:-}
      LLM_LOCAL_FALLBACK_MODEL: ${LLM_LOCAL_FALLBACK_MODEL:-qwen2.5:7b-instruct-q4_0}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-40}
      LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-70}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-768}
      LLM_MAX_CONTEXT_CHARS: ${LLM_MAX_CONTEXT_CHARS:-20000}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: frontend
      args:
        VITE_AI_ASSISTANT_ENABLED: ${VITE_AI_ASSISTANT_ENABLED:-false}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
