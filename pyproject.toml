[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["backend"]
branch = true
# Include the real bounded PDF worker, not just its parent request handler.
patch = ["subprocess"]
omit = ["*/migrations/*", "*/tests/*", "*/backend/manage.py", "*/backend/config/wsgi.py"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 95

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend"]
exclude = ["skills", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
