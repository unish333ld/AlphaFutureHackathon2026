  /api/v1/staff/applications/:
    get:
      operationId: v1_staff_applications_list
      description: 'До 10 заявок на странице. Сортировка стабильна: при равных значениях
        используется ID. assignment=free — свободные, mine — ваши, all — все. risk_level=unassessed
        — без оценки. search ищет по номеру, компании и ИНН. Сумма, срок и риск относятся
        к актуальной версии заявки. status_changed_at показывает время с начала текущего
        статуса, это не SLA.'
      summary: Очередь специалиста
      parameters:
      - in: query
        name: assignment
        schema:
          enum:
          - all
          - free
          - mine
          type: string
          default: all
          minLength: 1
        description: |-
          * `all` - all
          * `free` - free
          * `mine` - mine
      - in: query
        name: ordering
        schema:
          enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - assigned_at
          - -assigned_at
          - amount
          - -amount
          - term_months
          - -term_months
          - number
          - -number
          type: string
          default: -created_at
          minLength: 1
        description: |-
          * `created_at` - created_at
          * `-created_at` - -created_at
          * `updated_at` - updated_at
          * `-updated_at` - -updated_at
          * `assigned_at` - assigned_at
          * `-assigned_at` - -assigned_at
          * `amount` - amount
          * `-amount` - -amount
          * `term_months` - term_months
          * `-term_months` - -term_months
          * `number` - number
          * `-number` - -number
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: risk_level
        schema:
          enum:
          - low
          - medium
          - high
          - unassessed
          type: string
          minLength: 1
        description: |-
          * `low` - low
          * `medium` - medium
          * `high` - high
          * `unassessed` - unassessed
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
      - in: query
        name: status
        schema:
          enum:
          - draft
          - submitted
          - checking
          - review
          - needs_info
          - offered
          - accepted
          - signed
          - issued
          - rejected
          - declined
          - expired
          type: string
          minLength: 1
        description: |-
          * `draft` - Черновик
          * `submitted` - Отправлена
          * `checking` - Выполняются проверки
          * `review` - Рассмотрение специалистом
          * `needs_info` - Нужно уточнение
          * `offered` - Есть предложение
          * `accepted` - Предложение принято
          * `signed` - Условно подписана
          * `issued` - Моделируемая выдача выполнена
          * `rejected` - Отказ
          * `declined` - Клиент отклонил
          * `expired` - Срок предложения истёк
      tags:
      - Банк
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStaffApplicationListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    amount:
                    - Сумма вне границ продукта.
                  summary: Пример ошибки
          description: Неверный JSON, поля или параметры. Исправьте форму.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Действие недоступно.
                    code: permission_denied
                  summary: Пример ошибки
          description: Нет сессии, полномочий или корректного CSRF.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Не найдено.
                  summary: Пример ошибки
