  /api/v1/applications/:
    get:
      operationId: v1_applications_list
      summary: Заявки доступных компаний
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted
          - checking
          - declined
          - draft
          - expired
          - issued
          - needs_info
          - offered
          - rejected
          - review
          - signed
          - submitted
      tags:
      - Заявки
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationListList'
          description: ''
    post:
      operationId: v1_applications_create
      summary: Создать черновик
      tags:
      - Заявки
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
            examples:
              Заявка:
                value:
                  company: 00000000-0000-0000-0000-000000000001
                  product: 00000000-0000-0000-0000-000000000101
                  amount: '1000000.00'
                  term_months: 24
                  purpose: Пополнение оборотных средств
                  monthly_revenue: '1500000.00'
                  monthly_expenses: '900000.00'
                  monthly_debt_payments: '50000.00'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
