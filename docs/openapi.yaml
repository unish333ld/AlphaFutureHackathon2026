        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
  /api/v1/products/{id}/:
    get:
      operationId: v1_products_retrieve
      summary: Условия демо-продукта
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Кредитный продукт (демо).
        required: true
      tags:
      - Продукты
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/session/csrf/:
    get:
      operationId: v1_session_csrf_retrieve
      summary: Получить CSRF-токен и cookie
      tags:
      - Сессия
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/v1/session/login/:
    post:
      operationId: v1_session_login_create
