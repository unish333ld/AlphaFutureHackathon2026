openapi: 3.0.3
info:
  title: Умный кредитный кабинет предпринимателя
  version: 1.1.0
  description: 'Хакатонный backend: синтетические компании, локальные проверки, условная
    подпись и моделируемая выдача. Деньги передаются строками в рублях, сроки — в
    месяцах. Для Try it out [войдите в сессию](/api/session/login/) в той же вкладке.
    Swagger передаёт session cookie и X-CSRFToken автоматически. Изменяющие действия
    требуют актуальный lock_version из карточки заявки.'
paths:
  /api/v1/agreements/:
    get:
      operationId: v1_agreements_list
      summary: Доступные демо-договоры
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Договоры
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgreementList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    amount:
                    - Сумма вне границ продукта.
                  summary: Пример ошибки
          description: Неверный JSON, поля или параметры. Исправьте форму.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Действие недоступно.
                    code: permission_denied
                  summary: Пример ошибки
          description: Нет сессии, полномочий или корректного CSRF.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Не найдено.
                  summary: Пример ошибки
          description: Ресурс не существует или скрыт company scope; также страница
            пагинации вне диапазона.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Слишком много запросов.
                    code: throttled
                  summary: Пример ошибки
          description: Лимит запросов. Учитывайте Retry-After.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Сервис временно недоступен.
                    code: dependency_unavailable
                  summary: Пример ошибки
          description: PostgreSQL временно недоступен или истёк таймаут блокировки.
            Проверьте карточку перед повтором значимого действия.
  /api/v1/agreements/{id}/:
    get:
      operationId: v1_agreements_retrieve
      summary: Зафиксированные условия и SHA-256
      parameters:
      - in: path
        name: id
        schema:
          type: string
