      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Кредитная заявка.
        required: true
      tags:
      - Банк
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/v1/staff/applications/{id}/decide/:
    post:
      operationId: v1_staff_applications_decide_create
      description: 'Только specialist. Сервер использует сохранённую оценку текущей
        ревизии: одобрение, уменьшенная сумма или отказ. Ставку и решение нельзя назначить
        в теле запроса.'
