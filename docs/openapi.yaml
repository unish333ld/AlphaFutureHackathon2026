      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        expected_version:
          type: integer
          minimum: 0
      required:
      - expected_version
      - text
    SignRequestRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        lock_version:
          type: integer
          minimum: 0
          description: Актуальное значение из GET заявки.
        document_hash:
          type: string
          minLength: 1
          description: SHA-256 условий из GET договора.
          pattern: ^[0-9a-f]{64}$
        confirm_simulation:
          type: boolean
          description: Явное подтверждение условной подписи.
      required:
      - confirm_simulation
      - document_hash
      - lock_version
    SpecialistSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
      required:
      - first_name
      - id
      - last_name
      - username
    StaffApplicationList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
        number:
          type: string
          readOnly: true
          title: Номер заявки
        company_inn:
          type: string
          readOnly: true
        current_revision_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        term_months:
          type: integer
          readOnly: true
          nullable: true
        risk_level:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          - $ref: '#/components/schemas/NullEnum'
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/SpecialistSummary'
          readOnly: true
          nullable: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Назначена
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          title: Начало текущего состояния
      required:
      - amount
      - assigned_at
      - assigned_to
      - company
      - company_inn
      - company_name
      - created_at
      - created_by
      - current_revision_id
      - id
      - lock_version
      - number
      - product
      - product_name
      - risk_level
      - status
      - status_changed_at
      - term_months
      - updated_at
    SystemRoleEnum:
      enum:
      - client
      - specialist
      type: string
      description: |-
        * `client` - Представитель компании
        * `specialist` - Кредитный специалист
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Имя пользователя
          description: Обязательное поле. Не более 150 символов. Только буквы, цифры
            и символы @/./+/-/_.
        first_name:
          type: string
          readOnly: true
          title: Имя
        last_name:
          type: string
          readOnly: true
          title: Фамилия
        system_role:
          allOf:
          - $ref: '#/components/schemas/SystemRoleEnum'
          readOnly: true
          title: Системная роль
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Member'
          readOnly: true
      required:
      - first_name
      - id
      - last_name
      - memberships
      - system_role
      - username
    VersionRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        lock_version:
          type: integer
          minimum: 0
          description: Актуальное значение из GET заявки.
      required:
      - lock_version
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
