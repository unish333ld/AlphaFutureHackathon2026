  /api/v1/agreements/{id}/disburse/:
    post:
      operationId: v1_agreements_disburse_create
      description: 'Новая выдача: только назначенный текущий specialist, signed, подпись
        и неизменённые условия. Денежных переводов нет. Idempotency-Key обязателен
        и является UUID. Один договор — одна выдача. Тот же ключ + тот же договор
        возвращает прежний результат (200), даже с устаревшим lock_version и после
        автоматического освобождения назначения. lock_version — токен конкурентности,
        не финансовое содержимое повтора; иных изменяемых полей нет. Добавленные amount/status
        и другие поля — 400. Ключ другого договора или новый ключ для уже выданного
        — 409. После успеха GET карточки даёт новый lock_version и issued, назначение
        снято. При 409 обновите карточку и проверьте данные без автоматического повтора
        значимого действия.'
      summary: Выполнить моделируемую выдачу
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID. Повтор того же ключа и договора возвращает ту же выдачу
          даже при старом lock_version.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      tags:
      - Выдачи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
