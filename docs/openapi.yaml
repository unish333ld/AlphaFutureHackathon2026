        токен; используйте новый из ответа.
      summary: 'Войти: session cookie + CSRF'
      tags:
      - Сессия
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/session/logout/:
    post:
      operationId: v1_session_logout_create
      summary: Завершить сессию
      tags:
      - Сессия
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/staff/applications/:
    get:
      operationId: v1_staff_applications_list
      summary: Очередь специалиста
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted
          - checking
          - declined
          - draft
          - expired
          - issued
          - needs_info
          - offered
          - rejected
          - review
          - signed
          - submitted
      tags:
      - Банк
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationListList'
          description: ''
  /api/v1/staff/applications/{id}/:
    get:
      operationId: v1_staff_applications_retrieve
