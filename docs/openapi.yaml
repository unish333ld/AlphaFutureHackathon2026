                ПримерОшибки:
                  value:
                    detail: Не найдено.
                  summary: Пример ошибки
          description: Ресурс не существует или скрыт company scope; также страница
            пагинации вне диапазона.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Загрузите заявку заново.
                    code: stale_version
                  summary: Пример ошибки
          description: Конфликт версии, назначения или состояния. GET карточки, проверка
            пользователем; не повторяйте действие автоматически.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Слишком много запросов.
                    code: throttled
                  summary: Пример ошибки
          description: Лимит запросов. Учитывайте Retry-After.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ПримерОшибки:
                  value:
                    detail: Сервис временно недоступен.
                    code: dependency_unavailable
                  summary: Пример ошибки
          description: PostgreSQL временно недоступен или истёк таймаут блокировки.
            Проверьте карточку перед повтором значимого действия.
components:
  schemas:
    ActionEnum:
      enum:
      - update_draft
      - submit
      - retry_checks
      - provide_information
      - revise
      - claim
      - release
      - request_information
      - decide
      - accept_offer
      - decline_offer
      - sign_agreement
      - disburse
      type: string
      description: |-
        * `update_draft` - update_draft
        * `submit` - submit
        * `retry_checks` - retry_checks
        * `provide_information` - provide_information
        * `revise` - revise
        * `claim` - claim
        * `release` - release
        * `request_information` - request_information
        * `decide` - decide
        * `accept_offer` - accept_offer
        * `decline_offer` - decline_offer
        * `sign_agreement` - sign_agreement
        * `disburse` - disburse
    Agreement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        offer:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
          title: Номер демо-договора
        terms_snapshot:
          type: object
          properties:
            schema_version:
              type: integer
              enum:
              - 1
            offer_id:
              type: string
              format: uuid
            company_id:
              type: string
              format: uuid
            amount:
              type: string
              pattern: ^-?\d+\.\d{2}$
              example: '1000000.00'
            annual_rate:
              type: string
              pattern: ^\d+(\.\d+)?$
              example: '18.0000'
            term_months:
              type: integer
              minimum: 1
              maximum: 120
            monthly_payment:
              type: string
              pattern: ^-?\d+\.\d{2}$
              example: '1000000.00'
            schedule:
              type: object
              properties:
                schema_version:
                  type: integer
                  enum:
                  - 1
                method:
                  type: string
                  enum:
                  - demo_annuity_monthly
                fees:
                  type: string
                  enum:
                  - '0.00'
                rows:
                  type: array
                  minItems: 1
                  maxItems: 120
                  items:
                    type: object
                    properties:
                      month:
                        type: integer
                        minimum: 1
                        maximum: 120
                      payment:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                      principal:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                      interest:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                      balance:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                    required:
                    - month
                    - payment
                    - principal
                    - interest
                    - balance
                    additionalProperties: false
              required:
              - schema_version
              - method
              - fees
              - rows
              additionalProperties: false
            signature_mode:
              type: string
              enum:
              - simulation
          required:
          - schema_version
          - offer_id
          - company_id
          - amount
          - annual_rate
          - term_months
          - monthly_payment
          - schedule
          - signature_mode
          additionalProperties: false
          readOnly: true
        document_hash:
          type: string
          readOnly: true
          title: SHA-256 условий
        signed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        signed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Условно подписан
        signature_mode:
          type: string
          readOnly: true
          title: Способ подписи
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        disbursement:
          allOf:
          - $ref: '#/components/schemas/Disbursement'
          readOnly: true
          nullable: true
      required:
      - created_at
      - disbursement
      - document_hash
      - id
      - number
      - offer
      - signature_mode
      - signed_at
      - signed_by
      - terms_snapshot
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
        number:
          type: string
          readOnly: true
          title: Номер заявки
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
          readOnly: true
        current_revision_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/SpecialistSummary'
          readOnly: true
          nullable: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Назначена
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          title: Начало текущего состояния
        available_actions:
          type: array
          items:
            $ref: '#/components/schemas/AvailableAction'
          readOnly: true
      required:
      - assigned_at
      - assigned_to
      - available_actions
      - company
      - company_name
      - created_at
      - created_by
      - current_revision_id
      - id
      - lock_version
      - number
      - product
      - product_name
      - revisions
      - status
      - status_changed_at
      - updated_at
    ApplicationCreateRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Рубли, десятичная строка.
        term_months:
          type: integer
          maximum: 120
          minimum: 1
        purpose:
          type: string
          minLength: 1
          maxLength: 500
        monthly_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        monthly_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        monthly_debt_payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        company:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
      required:
      - amount
      - company
      - product
      - purpose
      - term_months
    ApplicationList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
      required:
      - company
      - company_name
      - created_at
      - created_by
      - id
      - lock_version
      - product
      - product_name
      - status
      - updated_at
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - checking
      - review
      - needs_info
      - offered
      - accepted
      - signed
      - issued
      - rejected
      - declined
      - expired
      type: string
      description: |-
        * `draft` - Черновик
        * `submitted` - Отправлена
        * `checking` - Выполняются проверки
        * `review` - Рассмотрение специалистом
        * `needs_info` - Нужно уточнение
        * `offered` - Есть предложение
        * `accepted` - Предложение принято
        * `signed` - Условно подписана
        * `issued` - Моделируемая выдача выполнена
        * `rejected` - Отказ
        * `declined` - Клиент отклонил
        * `expired` - Срок предложения истёк
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        revision:
          type: string
          format: uuid
          readOnly: true
        checks_attempt:
          type: integer
          readOnly: true
          title: Использованная попытка проверок
        score:
          type: integer
          readOnly: true
          title: Демо-скор
        risk_level:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          readOnly: true
          title: Риск
        factors:
          type: object
          properties:
            schema_version:
              type: integer
              enum:
              - 1
            failed_checks:
              type: array
              items:
                type: string
                enum:
                - registry
                - credit_history
                - financial
            monthly_cashflow:
              type: string
              pattern: ^-?\d+\.\d{2}$
              example: '1000000.00'
            payment_capacity:
              type: string
              pattern: ^-?\d+\.\d{2}$
              example: '1000000.00'
            capacity_fraction:
              type: string
              enum:
              - '0.50'
          required:
          - schema_version
          - failed_checks
          - monthly_cashflow
          - payment_capacity
          - capacity_fraction
          additionalProperties: false
          readOnly: true
        rules_version:
          type: string
          readOnly: true
          title: Версия скоринга
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        decision:
          allOf:
          - $ref: '#/components/schemas/CreditDecision'
          readOnly: true
          nullable: true
      required:
      - checks_attempt
      - created_at
      - decision
      - factors
      - id
      - revision
      - risk_level
      - rules_version
      - score
    AssistantReply:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
        version:
          type: integer
        model_status:
          $ref: '#/components/schemas/ModelStatusEnum'
        message:
          $ref: '#/components/schemas/Message'
      required:
      - conversation_id
      - message
      - model_status
      - version
    AvailableAction:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        allowed:
          type: boolean
        reason_code:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ReasonCodeEnum'
          - $ref: '#/components/schemas/NullEnum'
        target_id:
          type: string
          format: uuid
          nullable: true
          description: UUID заявки, предложения или договора для соответствующего
            действия. Подсказка не отменяет серверную проверку.
      required:
      - action
      - allowed
      - reason_code
      - target_id
    Check:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CheckKindEnum'
          readOnly: true
          title: Тип
        status:
          allOf:
          - $ref: '#/components/schemas/CheckStatusEnum'
          readOnly: true
          title: Результат
        attempt:
          type: integer
          readOnly: true
          title: Попытка
        result:
          oneOf:
          - type: object
            properties:
              schema_version:
                type: integer
                enum:
                - 1
              registration_status:
                type: string
                enum:
                - active
                - inactive
              retryable:
                type: boolean
            required:
            - schema_version
            - registration_status
            - retryable
            additionalProperties: false
          - type: object
            properties:
              schema_version:
                type: integer
                enum:
                - 1
              overdue:
                type: boolean
            required:
            - schema_version
            - overdue
            additionalProperties: false
          - type: object
            properties:
              schema_version:
                type: integer
                enum:
                - 1
              missing_fields:
                type: array
                items:
                  type: string
                  enum:
                  - monthly_revenue
                  - monthly_expenses
                  - monthly_debt_payments
            required:
            - schema_version
            - missing_fields
            additionalProperties: false
          description: 'Форма соответствует kind: registry, credit_history или financial.
            Локальные синтетические адаптеры v1; ошибка не является кредитным отказом.'
          readOnly: true
        source:
          type: string
          readOnly: true
          title: Источник
        is_mock:
          type: boolean
          readOnly: true
          title: Локальный мок
        checked_at:
          type: string
          format: date-time
          readOnly: true
          title: Проверено
      required:
      - attempt
      - checked_at
      - id
      - is_mock
      - kind
      - result
      - source
      - status
    CheckKindEnum:
      enum:
      - registry
      - credit_history
      - financial
      type: string
      description: |-
        * `registry` - Регистрационный статус
        * `credit_history` - Кредитная история
        * `financial` - Финансовые данные
    CheckStatusEnum:
      enum:
      - passed
      - failed
      - missing
      - error
      type: string
      description: |-
        * `passed` - Проверка пройдена
        * `failed` - Негативный результат
        * `missing` - Недостаточно данных
        * `error` - Техническая ошибка
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        inn:
          type: string
          readOnly: true
          title: Синтетический ИНН
        name:
          type: string
          readOnly: true
          title: Название
        kind:
          allOf:
          - $ref: '#/components/schemas/CompanyKindEnum'
          readOnly: true
          title: Тип
        registered_at:
          type: string
          format: date
          readOnly: true
          title: Дата регистрации
        status:
          allOf:
          - $ref: '#/components/schemas/CompanyStatusEnum'
          readOnly: true
          title: Статус
        is_existing_client:
          type: boolean
          readOnly: true
          title: Действующий клиент банка
        demo_scenario:
          allOf:
          - $ref: '#/components/schemas/DemoScenarioEnum'
