        injection.
      properties:
        company_id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
          nullable: true
      required:
      - company_id
    CreditDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        assessment:
          type: string
          format: uuid
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
          title: Решение
        reason_code:
          type: string
          readOnly: true
          title: Код причины
        explanation:
          type: string
          readOnly: true
          title: Объяснение
        decided_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        policy_version:
          type: string
          readOnly: true
          title: Версия кредитной политики
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        offer:
          allOf:
          - $ref: '#/components/schemas/Offer'
          readOnly: true
          nullable: true
      required:
      - assessment
      - created_at
      - decided_by
      - explanation
      - id
      - offer
      - outcome
      - policy_version
      - reason_code
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    DemoScenarioEnum:
      enum:
      - standard
      - check_error
      - bad_history
      type: string
      description: |-
        * `standard` - Стандартный
        * `check_error` - Ошибка регистрационной проверки
        * `bad_history` - Негативная кредитная история
    Disbursement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        agreement:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          title: Моделируемая сумма выдачи, ₽
        status:
          type: string
          readOnly: true
          title: Состояние
        idempotency_key:
          type: string
          format: uuid
          readOnly: true
          title: Ключ идемпотентности
        issued_at:
          type: string
          format: date-time
          readOnly: true
          title: Моделируемая выдача
        is_simulated:
          type: boolean
          readOnly: true
      required:
      - agreement
      - amount
      - id
      - idempotency_key
      - is_simulated
      - issued_at
      - status
    Error:
      description: 'Сохраняет формат DRF: общая ошибка detail и необязательный code;
        ошибки по именам полей (строка или массив строк), non_field_errors; в старых
        общих validation-ответах возможен массив строк.'
      anyOf:
      - type: object
        properties:
          detail:
            type: string
          code:
            type: string
        required:
        - detail
        additionalProperties: false
      - type: object
        minProperties: 1
        additionalProperties:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
      - type: array
        items:
          type: string
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        event_type:
          type: string
          readOnly: true
          title: Событие
        from_status:
          type: string
          readOnly: true
        to_status:
          type: string
          readOnly: true
        details:
          type: object
          properties:
            schema_version:
              type: integer
              enum:
              - 1
            attempt:
              type: integer
              minimum: 1
              maximum: 5
            retryable:
              type: boolean
            revision_no:
              type: integer
              minimum: 1
            reason_code:
              type: string
            outcome:
              type: string
              enum:
              - approved
              - counteroffer
              - rejected
            disbursement_id:
              type: string
              format: uuid
            is_simulated:
              type: boolean
              enum:
              - true
            signature_mode:
              type: string
              enum:
              - simulation
            assigned_to:
              type: string
              format: uuid
            reason:
              type: string
              enum:
              - manual
              - terminal_state
          required:
          - schema_version
          additionalProperties: false
          description: 'Безопасные метаданные v1; набор ключей зависит от event_type.
            Нет документов, секретов или произвольного пользовательского JSON. assignment_*:
            assigned_to; освобождение также reason.'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
      required:
      - actor
      - created_at
      - details
      - event_type
      - from_status
      - id
      - to_status
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    InformationRequest:
      type: object
      properties:
        id:
