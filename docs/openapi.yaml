      description: |-
        * `ip` - Индивидуальный предприниматель
        * `legal` - Юридическое лицо
    CompanyStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Действует
        * `inactive` - Деятельность прекращена
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        application:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - company
      - created_at
      - id
      - updated_at
      - version
    CreateConversationRequest:
      type: object
