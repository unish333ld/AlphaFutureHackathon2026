  /api/v1/agreements/{id}/generate-document/:
    post:
      operationId: v1_agreements_generate_document_create
      description: Только can_sign. Повтор возвращает тот же артефакт и байты. Стороны
        фиксируются для этой версии. document_hash — канонические условия; pdf_sha256
        — отдельный хеш байтов. Рендеринг вне транзакции; при изменении lock_version
        — 409. Нет подписи и выдачи.
      summary: Сформировать неизменяемый исходный PDF
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      tags:
