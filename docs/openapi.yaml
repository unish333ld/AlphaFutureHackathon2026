  /api/v1/agreements/{id}/sign/:
    post:
      operationId: v1_agreements_sign_create
      description: 'Единственный маршрут подписи: can_sign, актуальные lock_version/document_hash,
        document_id/pdf_sha256 просмотренного PDF, pending attempt_id, одноразовый
        code и confirm_simulation=true. Старый hash-only запрос больше не подписывает
        (400). Ошибки кода учитываются, после пяти попытка блокируется. Код не является
        ЭП/SMS; назначение не ограничивает клиента. После успеха перечитайте карточку:
        signed, новый lock_version, но ещё не issued. Копия с отметкой создаётся отдельным
        signed-document, её ошибка не повторяет подпись.'
      summary: Условно подписать принятую версию договора
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      tags:
      - Договоры
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
