components:
  schemas:
    AccessModeEnum:
      enum:
      - search_index
      - direct
      type: string
      description: |-
        * `search_index` - search_index
        * `direct` - direct
    ActionEnum:
      enum:
      - update_draft
      - submit
      - retry_checks
      - provide_information
      - revise
      - claim
      - release
      - request_information
      - decide
      - accept_offer
      - decline_offer
      - sign_agreement
      - disburse
      type: string
      description: |-
        * `update_draft` - update_draft
        * `submit` - submit
        * `retry_checks` - retry_checks
        * `provide_information` - provide_information
        * `revise` - revise
        * `claim` - claim
        * `release` - release
        * `request_information` - request_information
        * `decide` - decide
        * `accept_offer` - accept_offer
        * `decline_offer` - decline_offer
        * `sign_agreement` - sign_agreement
        * `disburse` - disburse
    Agreement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        offer:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
          title: Номер демо-договора
        terms_snapshot:
          type: object
          properties:
            schema_version:
              type: integer
              enum:
              - 1
            offer_id:
              type: string
              format: uuid
            company_id:
              type: string
              format: uuid
            amount:
              type: string
              pattern: ^-?\d+\.\d{2}$
              example: '1000000.00'
            annual_rate:
              type: string
              pattern: ^\d+(\.\d+)?$
              example: '18.0000'
            term_months:
              type: integer
              minimum: 1
              maximum: 120
            monthly_payment:
              type: string
              pattern: ^-?\d+\.\d{2}$
              example: '1000000.00'
            schedule:
              type: object
              properties:
                schema_version:
                  type: integer
                  enum:
                  - 1
                method:
                  type: string
                  enum:
                  - demo_annuity_monthly
                fees:
                  type: string
                  enum:
                  - '0.00'
                rows:
                  type: array
                  minItems: 1
                  maxItems: 120
                  items:
                    type: object
                    properties:
                      month:
                        type: integer
                        minimum: 1
                        maximum: 120
                      payment:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                      principal:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                      interest:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                      balance:
                        type: string
                        pattern: ^-?\d+\.\d{2}$
                        example: '1000000.00'
                    required:
                    - month
                    - payment
                    - principal
                    - interest
                    - balance
                    additionalProperties: false
              required:
              - schema_version
              - method
              - fees
              - rows
              additionalProperties: false
            signature_mode:
              type: string
              enum:
              - simulation
            cost_breakdown:
              $ref: '#/components/schemas/CostBreakdown'
            catalog_version:
              type: string
            product_name:
              type: string
            purpose:
              type: string
            parties:
              type: object
              properties:
                company:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    inn:
                      type: string
                    name:
                      type: string
                    status:
                      type: string
                      enum:
                      - active
                      - inactive
                    registered_at:
                      type: string
                      format: date
                    demo_scenario:
                      type: string
                      enum:
                      - standard
                      - bad_history
                      - check_error
                    is_existing_client:
                      type: boolean
                  required:
                  - id
                  - inn
                  - name
                  - status
                  - registered_at
                  - demo_scenario
                  - is_existing_client
                  additionalProperties: false
              required:
              - company
              additionalProperties: false
          required:
          - schema_version
          - offer_id
          - company_id
          - amount
          - annual_rate
          - term_months
          - monthly_payment
          - schedule
          - signature_mode
          additionalProperties: false
          readOnly: true
        cost_breakdown:
          allOf:
          - $ref: '#/components/schemas/CostBreakdown'
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AgreementDocument'
          readOnly: true
        confirmation:
          allOf:
          - $ref: '#/components/schemas/SignatureConfirmation'
          readOnly: true
          nullable: true
        document_hash:
          type: string
          readOnly: true
          title: SHA-256 условий
        signed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        signed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Условно подписан
        signature_mode:
          type: string
          readOnly: true
          title: Способ подписи
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        disbursement:
          allOf:
          - $ref: '#/components/schemas/Disbursement'
          readOnly: true
          nullable: true
      required:
      - confirmation
      - cost_breakdown
      - created_at
      - disbursement
      - document_hash
      - documents
      - id
      - number
      - offer
      - signature_mode
      - signed_at
      - signed_by
      - terms_snapshot
    AgreementDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/AgreementDocumentKindEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        template_version:
          type: string
          readOnly: true
        calculator_version:
          type: string
          readOnly: true
        terms_hash:
          type: string
          readOnly: true
        pdf_sha256:
          type: string
          readOnly: true
        source_document:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
      required:
      - calculator_version
      - created_at
      - id
      - kind
      - pdf_sha256
      - source_document
      - template_version
      - terms_hash
      - version
    AgreementDocumentKindEnum:
      enum:
      - original
      - signed_copy
      type: string
      description: |-
        * `original` - Исходный договор
        * `signed_copy` - Копия с отметкой демо-подтверждения
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
          title: Номер заявки
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
          readOnly: true
        current_revision_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/SpecialistSummary'
          readOnly: true
          nullable: true
        assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Назначена
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
          title: Начало текущего состояния
        available_actions:
          type: array
          items:
            $ref: '#/components/schemas/AvailableAction'
          readOnly: true
        readiness:
          allOf:
          - $ref: '#/components/schemas/ApplicationReadiness'
          readOnly: true
      required:
      - assigned_at
      - assigned_to
      - available_actions
      - company
      - company_name
      - created_at
      - created_by
      - current_revision_id
      - id
      - lock_version
      - number
      - product
      - product_name
      - readiness
      - revisions
      - status
      - status_changed_at
      - updated_at
    ApplicationCreateRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Рубли, десятичная строка.
        term_months:
          type: integer
          maximum: 120
          minimum: 1
        purpose:
          type: string
          minLength: 1
          maxLength: 500
        monthly_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        monthly_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        monthly_debt_payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        company:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
      required:
      - amount
      - company
      - product
      - purpose
      - term_months
    ApplicationList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
          title: Номер заявки
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
      required:
      - company
      - company_name
      - created_at
      - created_by
      - id
      - lock_version
      - number
      - product
      - product_name
      - status
      - updated_at
    ApplicationReadiness:
      type: object
      properties:
        schema_version:
          type: integer
        revision_id:
          type: string
          format: uuid
          nullable: true
        lock_version:
          type: integer
        can_submit:
          type: boolean
        submit_reason_code:
          type: string
          nullable: true
        financial_data_complete:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessItem'
        verification_state:
          $ref: '#/components/schemas/VerificationStateEnum'
        verification_message:
          type: string
        checked_at:
          type: string
          format: date-time
          nullable: true
        disclosure:
          type: string
      required:
      - can_submit
      - checked_at
      - disclosure
      - financial_data_complete
      - items
      - lock_version
      - revision_id
      - schema_version
      - submit_reason_code
      - verification_message
      - verification_state
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - checking
      - review
      - needs_info
      - offered
      - accepted
      - signed
      - issued
      - rejected
      - declined
      - expired
      type: string
      description: |-
        * `draft` - Черновик
        * `submitted` - Отправлена
        * `checking` - Выполняются проверки
        * `review` - Рассмотрение специалистом
        * `needs_info` - Нужно уточнение
        * `offered` - Есть предложение
        * `accepted` - Предложение принято
        * `signed` - Условно подписана
        * `issued` - Моделируемая выдача выполнена
        * `rejected` - Отказ
        * `declined` - Клиент отклонил
        * `expired` - Срок предложения истёк
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        revision:
          type: string
          format: uuid
          readOnly: true
        checks_attempt:
          type: integer
          readOnly: true
          title: Использованная попытка проверок
        score:
