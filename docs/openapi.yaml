openapi: 3.0.3
info:
  title: Умный кредитный кабинет предпринимателя
  version: 1.0.0
  description: 'Хакатонный backend: синтетические компании, локальные проверки, условная
    подпись и моделируемая выдача. Деньги передаются строками в рублях, сроки — в
    месяцах. Для Try it out [войдите в сессию](/api/session/login/) в той же вкладке.
    Swagger передаёт session cookie и X-CSRFToken автоматически. Изменяющие действия
    требуют актуальный lock_version из карточки заявки.'
paths:
  /api/v1/agreements/:
    get:
      operationId: v1_agreements_list
      summary: Доступные демо-договоры
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Договоры
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAgreementList'
          description: ''
  /api/v1/agreements/{id}/:
    get:
      operationId: v1_agreements_retrieve
      summary: Зафиксированные условия и SHA-256
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      tags:
      - Договоры
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agreement'
          description: ''
  /api/v1/agreements/{id}/disburse/:
    post:
      operationId: v1_agreements_disburse_create
      description: Только specialist. Денежных переводов нет. Один договор — одна
        выдача; повторный ключ с другим договором даёт 409.
      summary: Выполнить моделируемую выдачу
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: UUID. Повтор того же ключа и договора возвращает ту же выдачу
          даже при старом lock_version.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      tags:
      - Выдачи
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VersionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VersionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disbursement'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/agreements/{id}/sign/:
    post:
      operationId: v1_agreements_sign_create
      description: Требует can_sign, document_hash и confirm_simulation=true. Юридически
        значимая электронная подпись не выполняется.
      summary: Условно подписать принятую версию договора
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      tags:
      - Договоры
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequestRequest'
          application/x-www-form-urlencoded:
            schema:
