  /api/v1/agreements/{id}/signature-attempt/:
    post:
      operationId: v1_agreements_signature_attempt_create
      description: Только can_sign после явного ознакомления с конкретным PDF. Срок
        2 минуты, до 5 проверок, до 10 новых попыток в час на участника и договор.
