  /api/v1/staff/applications/{id}/decide/:
    post:
      operationId: v1_staff_applications_decide_create
      description: 'Только назначенный текущий specialist, статус review и актуальный
        lock_version. Сотрудник запускает серверную политику; тело не принимает исход,
        ставку или сумму. Используется assessment текущей (максимальный revision_no)
        отправленной ревизии и её checks_attempt: полный набор registry/credit_history/financial
        без missing/error, оценка создана после этих проверок. Новая попытка делает
        старую оценку непригодной. Результат approved/counteroffer/rejected, reason_code,
        explanation, policy_version и offer находятся в revisions[0].assessment.decision;
        ссылки assessment/revision и checks_attempt явные. Повтор после решения —
        409, нового решения/предложения не создаёт. Конфликт назначения, версии, состояния
        или устаревшей оценки — 409: обновите карточку и предложите пользователю проверить
        данные. Положительный результат сохраняет исполнителя при ожидании клиента;
        отказ освобождает назначение.'
      summary: Принять решение по серверным правилам
