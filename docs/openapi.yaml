  /api/v1/agreements/{id}/pdf/:
    get:
      operationId: v1_agreements_pdf_retrieve
      description: 'Авторизованный company scope; специалист может читать доступный
        ему договор. Повтор отдаёт те же сохранённые байты. Cache-Control: private,
        no-store; Vary: Cookie. Публичного media URL нет. Несформированный документ
        — 404.'
      summary: Открыть или скачать сохранённый приватный PDF
      parameters:
      - in: query
        name: download
        schema:
          type: boolean
        description: 'true: attachment; иначе inline'
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Демо-договор.
        required: true
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - original
          - signed_copy
        description: По умолчанию original
      tags:
      - Договоры
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
        '400':
