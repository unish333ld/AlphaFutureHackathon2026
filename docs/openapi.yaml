        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/staff/applications/{id}/request-information/:
    post:
      operationId: v1_staff_applications_request_information_create
      summary: Запросить уточнение у компании
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Кредитная заявка.
        required: true
      tags:
      - Банк
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InformationRequestInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InformationRequestInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InformationRequestInputRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Agreement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        offer:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          readOnly: true
          title: Номер демо-договора
        terms_snapshot:
          readOnly: true
          title: Зафиксированные условия (v1)
        document_hash:
          type: string
          readOnly: true
          title: SHA-256 условий
        signed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        signed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Условно подписан
        signature_mode:
          type: string
          readOnly: true
          title: Способ подписи
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        disbursement:
          allOf:
          - $ref: '#/components/schemas/Disbursement'
          readOnly: true
          nullable: true
      required:
      - created_at
      - disbursement
      - document_hash
      - id
      - number
      - offer
      - signature_mode
      - signed_at
      - signed_by
      - terms_snapshot
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/Revision'
          readOnly: true
      required:
      - company
      - company_name
      - created_at
      - created_by
      - id
      - lock_version
      - product
      - product_name
      - revisions
      - status
      - updated_at
    ApplicationCreateRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Рубли, десятичная строка.
        term_months:
          type: integer
          maximum: 120
          minimum: 1
        purpose:
          type: string
          minLength: 1
          maxLength: 500
        monthly_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        monthly_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        monthly_debt_payments:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          nullable: true
        company:
          type: string
          format: uuid
        product:
          type: string
          format: uuid
      required:
      - amount
      - company
      - product
      - purpose
      - term_months
    ApplicationList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        company:
          type: string
          format: uuid
          readOnly: true
        company_name:
          type: string
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
          title: Состояние
        lock_version:
          type: integer
          readOnly: true
          title: Версия для конкурентных изменений
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Изменена
      required:
      - company
      - company_name
      - created_at
      - created_by
      - id
      - lock_version
      - product
      - product_name
      - status
      - updated_at
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - checking
      - review
      - needs_info
      - offered
      - accepted
      - signed
      - issued
      - rejected
      - declined
      - expired
      type: string
      description: |-
        * `draft` - Черновик
        * `submitted` - Отправлена
        * `checking` - Выполняются проверки
        * `review` - Рассмотрение специалистом
        * `needs_info` - Нужно уточнение
        * `offered` - Есть предложение
        * `accepted` - Предложение принято
        * `signed` - Условно подписана
        * `issued` - Моделируемая выдача выполнена
        * `rejected` - Отказ
        * `declined` - Клиент отклонил
        * `expired` - Срок предложения истёк
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        score:
          type: integer
          readOnly: true
          title: Демо-скор
        risk_level:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          readOnly: true
          title: Риск
        factors:
          readOnly: true
          title: Факторы оценки (v1)
        rules_version:
          type: string
          readOnly: true
          title: Версия скоринга
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        decision:
          allOf:
          - $ref: '#/components/schemas/CreditDecision'
          readOnly: true
          nullable: true
      required:
      - created_at
      - decision
      - factors
      - id
      - risk_level
      - rules_version
      - score
    Check:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/CheckKindEnum'
          readOnly: true
          title: Тип
        status:
          allOf:
          - $ref: '#/components/schemas/CheckStatusEnum'
          readOnly: true
          title: Результат
        attempt:
          type: integer
          readOnly: true
          title: Попытка
        result:
          readOnly: true
          title: Результат адаптера (v1)
        source:
          type: string
          readOnly: true
          title: Источник
        is_mock:
          type: boolean
          readOnly: true
          title: Локальный мок
        checked_at:
          type: string
          format: date-time
          readOnly: true
          title: Проверено
      required:
      - attempt
      - checked_at
      - id
      - is_mock
      - kind
      - result
      - source
      - status
    CheckKindEnum:
      enum:
      - registry
      - credit_history
      - financial
      type: string
      description: |-
        * `registry` - Регистрационный статус
        * `credit_history` - Кредитная история
        * `financial` - Финансовые данные
    CheckStatusEnum:
      enum:
      - passed
      - failed
      - missing
      - error
      type: string
      description: |-
        * `passed` - Проверка пройдена
        * `failed` - Негативный результат
        * `missing` - Недостаточно данных
        * `error` - Техническая ошибка
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        inn:
          type: string
          readOnly: true
          title: Синтетический ИНН
        name:
          type: string
          readOnly: true
          title: Название
        kind:
          allOf:
          - $ref: '#/components/schemas/CompanyKindEnum'
          readOnly: true
          title: Тип
        registered_at:
          type: string
          format: date
          readOnly: true
          title: Дата регистрации
        status:
          allOf:
          - $ref: '#/components/schemas/CompanyStatusEnum'
          readOnly: true
          title: Статус
        is_existing_client:
          type: boolean
          readOnly: true
          title: Действующий клиент банка
        demo_scenario:
          allOf:
          - $ref: '#/components/schemas/DemoScenarioEnum'
          readOnly: true
          title: Сценарий локального мока
      required:
      - demo_scenario
      - id
      - inn
      - is_existing_client
      - kind
      - name
      - registered_at
      - status
    CompanyKindEnum:
      enum:
      - ip
      - legal
      type: string
      description: |-
        * `ip` - Индивидуальный предприниматель
        * `legal` - Юридическое лицо
    CompanyStatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Действует
        * `inactive` - Деятельность прекращена
    CreditDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
          title: Решение
        reason_code:
          type: string
          readOnly: true
          title: Код причины
        explanation:
          type: string
          readOnly: true
          title: Объяснение
        decided_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        policy_version:
          type: string
          readOnly: true
          title: Версия кредитной политики
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        offer:
          allOf:
          - $ref: '#/components/schemas/Offer'
          readOnly: true
          nullable: true
      required:
      - created_at
      - decided_by
      - explanation
      - id
      - offer
      - outcome
      - policy_version
      - reason_code
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    DemoScenarioEnum:
      enum:
      - standard
      - check_error
      - bad_history
      type: string
      description: |-
        * `standard` - Стандартный
        * `check_error` - Ошибка регистрационной проверки
        * `bad_history` - Негативная кредитная история
    Disbursement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        agreement:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          title: Моделируемая сумма выдачи, ₽
        status:
          type: string
          readOnly: true
          title: Состояние
        idempotency_key:
          type: string
          format: uuid
          readOnly: true
          title: Ключ идемпотентности
        issued_at:
          type: string
          format: date-time
          readOnly: true
          title: Моделируемая выдача
        is_simulated:
          type: boolean
          readOnly: true
      required:
      - agreement
      - amount
      - id
      - idempotency_key
      - is_simulated
      - issued_at
      - status
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Описание ошибки. При валидации ответ содержит ошибки по именам
            полей.
      required:
      - detail
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        event_type:
          type: string
          readOnly: true
          title: Событие
        from_status:
          type: string
          readOnly: true
        to_status:
          type: string
          readOnly: true
        details:
          readOnly: true
          title: Безопасные сведения (v1)
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
      required:
      - actor
      - created_at
      - details
      - event_type
      - from_status
      - id
      - to_status
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    InformationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        question:
          type: string
          readOnly: true
          title: Запрошенные сведения
        requested_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
        response_revision:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        responded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - question
      - requested_by
      - responded_at
      - response_revision
    InformationRequestInputRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        lock_version:
          type: integer
          minimum: 0
          description: Актуальное значение из GET заявки.
        question:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - lock_version
      - question
    LoginRequestRequest:
      type: object
      description: Reject extra fields instead of silently dropping status/rate/role
        injection.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          description: Обновлённый CSRF-токен после входа.
      required:
      - csrf_token
      - user
    Member:
      type: object
      properties:
        company:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Роль в компании
        can_submit:
          type: boolean
          readOnly: true
          title: Может отправлять заявки
        can_sign:
          type: boolean
          readOnly: true
          title: Может условно подписывать договор
        active:
          type: boolean
          readOnly: true
          title: Действующее членство
      required:
      - active
      - can_sign
      - can_submit
      - company
      - role
    Offer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application_id:
          type: string
          format: uuid
          readOnly: true
        decision:
          type: string
          format: uuid
          readOnly: true
        product:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          title: Сумма, ₽
        annual_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,4})?$
          readOnly: true
          title: Годовая ставка, %
        term_months:
          type: integer
          readOnly: true
          title: Срок, месяцев
        monthly_payment:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          title: Регулярный платёж, ₽
        schedule:
          readOnly: true
          title: Упрощённый график по номерам месяцев (v1)
        status:
          allOf:
          - $ref: '#/components/schemas/OfferStatusEnum'
          readOnly: true
          title: Состояние
        expires_at:
          type: string
          format: date-time
          readOnly: true
          title: Принять до
        accepted_at:
          type: string
          format: date-time
